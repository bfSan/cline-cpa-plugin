<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<title>Cline 账号面板</title>
<style>
/* Theme tokens aligned with the CPA management panel. Embedded iframes mirror
   the parent's data-theme; standalone pages follow the OS color scheme. */
:root{
  --bg:#faf9f5;--card:#ffffff;--border:#e3e1db;--fg:#2d2a26;--mut:#6d6760;
  --acc:#4c8dff;--on-acc:#ffffff;--ok:#10b981;--warn:#e0aa14;--err:#c65746;
  --surface:#f0eee8;--surface-muted:#e9e6df;--btn-sec:#eef1f6;--btn-sec-hover:#e4e8ef;
  --input-bg:#ffffff;--code-bg:#f3f4f6;--code-fg:#374151;--placeholder:rgba(109,103,96,.55);
  --ok-soft:rgba(16,185,129,.10);--ok-border:rgba(16,185,129,.30);
  --warn-soft:rgba(224,170,20,.12);--warn-border:rgba(224,170,20,.32);
  --err-soft:rgba(198,87,70,.10);--err-border:rgba(198,87,70,.30);
  --mut-soft:rgba(109,103,96,.12);--mut-border:rgba(109,103,96,.28);
  --scrim:rgba(45,42,38,.35);--toast-shadow:0 10px 28px rgba(0,0,0,.12),0 0 0 1px rgba(0,0,0,.04);
  --modal-shadow:0 24px 56px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.04);
  --acc-ring:rgba(76,141,255,.18);--radius-md:12px;--radius-lg:16px;
  color-scheme:light
}
:root[data-theme="white"]{
  --bg:#f5f5f5;--card:#ffffff;--border:#e6e6e6;--fg:#1f1f1f;--mut:#707070;
  --surface:#fafafa;--surface-muted:#efefef;--btn-sec:#f0f0f0;--btn-sec-hover:#e8e8e8;
  --input-bg:#ffffff;--code-bg:#f3f4f6;--code-fg:#374151;--placeholder:rgba(112,112,112,.55);
  --scrim:rgba(0,0,0,.32);--toast-shadow:0 10px 28px rgba(0,0,0,.10),0 0 0 1px rgba(0,0,0,.04);
  --modal-shadow:0 24px 56px rgba(0,0,0,.16),0 0 0 1px rgba(0,0,0,.04);
  color-scheme:light
}
:root[data-theme="dark"]{
  --bg:#1e1d1b;--card:#26241f;--border:#3a3833;--fg:#ede9e3;--mut:#9a948c;
  --acc:#4c8dff;--on-acc:#ffffff;--ok:#34d399;--warn:#f0c050;--err:#e07a6a;
  --surface:#2f2d28;--surface-muted:#35332e;--btn-sec:#35332e;--btn-sec-hover:#3f3c36;
  --input-bg:#1e1d1b;--code-bg:#35332e;--code-fg:#d6d1c9;--placeholder:rgba(154,148,140,.55);
  --ok-soft:rgba(52,211,153,.12);--ok-border:rgba(52,211,153,.38);
  --warn-soft:rgba(240,192,80,.14);--warn-border:rgba(240,192,80,.38);
  --err-soft:rgba(224,122,106,.12);--err-border:rgba(224,122,106,.38);
  --mut-soft:rgba(154,148,140,.16);--mut-border:rgba(154,148,140,.32);
  --scrim:rgba(0,0,0,.55);--toast-shadow:0 10px 28px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.03);
  --modal-shadow:0 24px 56px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.04);
  --acc-ring:rgba(76,141,255,.28);
  color-scheme:dark
}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px}
h1{font-size:20px;margin:0 0 4px}.sub{color:var(--mut);font-size:13px;margin-bottom:20px}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
button{background:var(--acc);color:var(--on-acc);border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px;white-space:nowrap}
button.sec{background:var(--btn-sec);color:var(--fg)}button.sec:hover{background:var(--btn-sec-hover)}button:disabled{opacity:.5;cursor:default}
.toggle{display:flex;gap:8px;align-items:center;color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:14px}
.card,.summary{min-width:0;background:var(--card);border:1px solid var(--border);border-radius:12px}
.card{padding:16px}
.card h2{font-size:15px;margin:0 0 2px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.uid{color:var(--mut);font-size:11px;font-family:ui-monospace,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:12px}
.badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok-border);white-space:nowrap}
.badge.pro{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn-border)}
.badge.disabled{background:var(--mut-soft);color:var(--mut);border:1px solid var(--mut-border)}
.badge.unknown{background:var(--mut-soft);color:var(--mut);border:1px solid var(--mut-border)}
.summary{padding:16px;margin-bottom:14px}
.summary-hd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.summary-title{font-weight:700;font-size:14px}
.summary-meta{color:var(--mut);font-size:12px}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.summary-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.summary-item .k{color:var(--mut);font-size:11px;margin-bottom:4px}
.summary-item .v{font-size:18px;font-weight:700}
.summary-item .v.ok{color:var(--ok)}
.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px dashed var(--border)}
.row:first-of-type{border-top:0}.k{color:var(--mut)}.v{font-weight:600;text-align:right;overflow-wrap:anywhere}
.v.ok{color:var(--ok)}.v.warn{color:var(--warn)}.v.err{color:var(--err)}
.actions{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.field-input{flex:1;min-width:0;max-width:100%;background:var(--input-bg);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--fg)}
.toasts{position:fixed;top:16px;right:16px;display:flex;flex-direction:column;gap:10px;z-index:9999;max-width:360px}
.toast{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--acc);border-radius:var(--radius-md);padding:14px 18px;font-size:13px;box-shadow:var(--toast-shadow);transform:translateX(120%);opacity:0;transition:transform .3s cubic-bezier(.2,.9,.3,1.1),opacity .25s;cursor:pointer;word-break:break-all}
.toast.show{transform:translateX(0);opacity:1}
.toast.ok{border-left-color:var(--ok);background:var(--ok-soft)}
.toast.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.toast.err{border-left-color:var(--err);background:var(--err-soft)}
.toast .t{font-weight:600;margin-bottom:3px}
.toast .d{color:var(--mut);font-size:12px;line-height:1.45}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--on-acc);border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{color:var(--mut);text-align:center;padding:40px}
.footer{margin-top:18px;text-align:center;color:var(--mut);font-size:12px}
.modal-mask{position:fixed;inset:0;background:var(--scrim);display:none;align-items:center;justify-content:center;z-index:9000;padding:16px;backdrop-filter:blur(2px)}
.modal-mask.show{display:flex}
.modal{background:var(--card);color:var(--fg);border:1px solid var(--border);border-radius:var(--radius-lg);width:min(560px,100%);max-height:min(90vh,640px);display:flex;flex-direction:column;box-shadow:var(--modal-shadow)}
.modal-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)}
.modal-hd h2{font-size:15px;margin:0;color:var(--fg);font-weight:600}
.modal-x{background:transparent;color:var(--mut);padding:4px 10px;font-size:18px;line-height:1}
.modal-x:hover{color:var(--fg);background:var(--surface-muted)}
.modal-bd{padding:16px;overflow:auto}
.modal-bd .hint{color:var(--mut);font-size:12px;margin:0 0 10px;line-height:1.5}
.oauth-status{padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);line-height:1.55}
.oauth-status.ok{border-color:var(--ok-border);background:var(--ok-soft);color:var(--ok)}
.oauth-status.err{border-color:var(--err-border);background:var(--err-soft);color:var(--err)}
.oauth-url-row{display:flex;gap:8px;margin:12px 0}
.oauth-url-row .field-input{min-width:0;font:11px/1.4 ui-monospace,monospace}
.modal-ft{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--border);background:var(--surface);border-radius:0 0 var(--radius-lg) var(--radius-lg);flex-wrap:wrap}
.mut{color:var(--mut)}
.model-rows{display:flex;flex-direction:column;gap:6px;max-height:560px;overflow:auto;padding-right:2px}
.model-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
.model-row.hidden{opacity:.60}
.model-id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;font-weight:600;min-width:0;overflow-wrap:anywhere;flex:1 1 auto}
.model-name{font-size:12px;flex:0 1 42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.model-actions{display:flex;gap:6px;flex:0 0 auto}
.model-actions .ftag{padding:2px 8px;font-size:12px}
.model-actions .ftag[disabled]{opacity:.4;cursor:default}
.ftag{background:var(--surface);border:1px solid var(--border);color:var(--mut);border-radius:99px;padding:5px 14px;font-size:12px;cursor:pointer;font-weight:600}
.ftag.active{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.ftag .cnt{font-size:10px;opacity:.75;margin-left:4px}
.filter-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
@media (max-width:640px){
  .wrap{padding:18px 12px}
  .bar,.filter-bar,.actions,.oauth-url-row{min-width:0}
  .bar>*{max-width:100%}
  .filter-bar .field-input{flex:1 1 100%;width:100%}
  #modelBox h2{align-items:flex-start;flex-wrap:wrap}
  #modelBox h2>span{max-width:100%;flex-wrap:wrap}
  .model-name{display:none}
  .model-row{align-items:flex-start;flex-wrap:wrap}
  .model-actions{margin-left:auto}
}
</style>
<script>
/* Early theme sync: mirror the CPA parent theme when embedded; otherwise use
   the OS preference. Same source-of-truth semantics as the other CPA plugins. */
(function(){
  var ATTR="data-theme";
  function embedded(){try{return window.self!==window.top}catch(e){return false}}
  function apply(t){var el=document.documentElement;if(t==="white"||t==="dark")el.setAttribute(ATTR,t);else el.removeAttribute(ATTR)}
  function parentTheme(){
    if(!embedded())return null;
    try{var raw=window.parent.document.documentElement.getAttribute(ATTR);if(raw==="white"||raw==="dark")return raw;return "light"}catch(e){return null}
  }
  function systemTheme(){try{return window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}catch(e){return "light"}}
  function sync(){apply(parentTheme()||systemTheme())}
  sync();
  window.__clineThemeSync=function(){
    sync();
    if(!embedded()){
      try{var mq=window.matchMedia("(prefers-color-scheme: dark)");var on=function(){sync()};if(mq.addEventListener)mq.addEventListener("change",on);else if(mq.addListener)mq.addListener(on)}catch(e){}
      return;
    }
    try{
      var parentEl=window.parent.document.documentElement;
      new MutationObserver(sync).observe(parentEl,{attributes:true,attributeFilter:[ATTR]});
      window.addEventListener("storage",function(e){if(e.key==="cli-proxy-theme")sync()});
    }catch(e){}
  };
})();
</script>
</head>
<body>
<div class="wrap">
  <h1>Cline / ClinePass</h1>
  <div class="sub">OAuth 订阅接入，不使用 API Key。ClinePass 按套餐额度使用，订阅权益不足的模型会明确报错，不会让整个账号进入冷却。</div>
  <div id="authBox" class="card" style="display:none;margin-bottom:16px">
    <div style="margin-bottom:8px;color:var(--mut)">需要管理密钥（management key）才能访问账号数据。从 CPA 主面板嵌入时会自动获取，无需输入。</div>
    <div style="display:flex;gap:8px">
      <input id="keyInput" type="password" placeholder="management key" class="field-input">
      <button onclick="saveKey()">连接</button>
    </div>
  </div>
  <div class="bar">
    <button id="refreshBtn" onclick="load(true,this)">刷新数据</button>
    <button class="sec" onclick="openOAuthModal()">OAuth 登录</button>
    <span class="toggle" id="statusText" role="status" aria-live="polite"></span>
  </div>
  <div class="filter-bar" id="filterBar">
    <button type="button" class="ftag active" data-group="all" onclick="filterGroup('all',this)">全部 <span class="cnt" id="cntAll">0</span></button>
    <button type="button" class="ftag" data-group="default" onclick="filterGroup('default',this)">Recommended <span class="cnt" id="cntDefault">0</span></button>
    <button type="button" class="ftag" data-group="clinepass" onclick="filterGroup('clinepass',this)">ClinePass <span class="cnt" id="cntPass">0</span></button>
    <button type="button" class="ftag" data-group="free" onclick="filterGroup('free',this)">Free <span class="cnt" id="cntFree">0</span></button>
    <button type="button" class="ftag" data-group="clinecloud" onclick="filterGroup('clinecloud',this)">Cloud <span class="cnt" id="cntCloud">0</span></button>
    <input id="accountSearch" class="field-input" type="search" placeholder="搜索账号昵称、邮箱或文件" oninput="setAccountSearch(this.value)" aria-label="搜索账号">
  </div>
  <div class="summary card" id="summaryBox" style="display:none"></div>
  <div id="grid" class="grid"><div class="loading">加载中…</div></div>
  <div class="card" id="modelBox" style="margin-top:16px">
    <h2>模型列表 <span style="display:flex;gap:6px;align-items:center">
      <span class="badge" id="modelSource" title="当前模型目录的来源">—</span>
      <button type="button" class="ftag" onclick="loadModels(true)">刷新</button>
    </span></h2>
    <p class="mut" id="modelHint" style="margin:6px 0 10px;font-size:12px"></p>
    <div id="modelList"><div class="loading">加载中…</div></div>
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
      <input id="modelAddInput" class="field-input" type="text" placeholder="添加自定义模型 ID" aria-label="添加自定义模型 ID">
      <button type="button" class="ftag" onclick="addModel()">添加</button>
    </div>
  </div>
  <footer class="footer">管理接口：<code id="apiPath"></code></footer>
</div>

<div class="modal-mask" id="oauthModal" onclick="onOAuthMaskClick(event)">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="oauthModalTitle">
    <div class="modal-hd">
      <h2 id="oauthModalTitle">OAuth 登录 Cline</h2>
      <button type="button" class="modal-x" onclick="closeOAuthModal()" aria-label="关闭">×</button>
    </div>
    <div class="modal-bd">
      <div class="oauth-status" id="oauthStatus" role="status" aria-live="polite">正在创建登录会话…</div>
      <div class="oauth-url-row">
        <input id="oauthUrl" class="field-input" type="text" readonly aria-label="OAuth 登录地址">
        <button type="button" class="sec" onclick="copyOAuthURL(this)">复制</button>
      </div>
      <p class="hint">请在浏览器中完成 Cline 登录。本页会自动轮询，成功后账号会直接写入 CPA。</p>
    </div>
    <div class="modal-ft">
      <button type="button" class="sec" onclick="restartOAuthLogin(this)">重新获取</button>
      <button type="button" class="sec" onclick="closeOAuthModal()">关闭</button>
      <button type="button" onclick="openOAuthURL()">打开登录页</button>
    </div>
  </div>
</div>
<div class="toasts" id="toasts"></div>

<script>
const MANAGEMENT_BASE_PATH=__CLINE_MANAGEMENT_BASE_PATH_JSON__;
const API=MANAGEMENT_BASE_PATH+"/plugins/cline";
const ENC_PREFIX="enc::v1::";
const SECRET_SALT="cli-proxy-api-webui::secure-storage";
const PANEL_STORE="cli-proxy-auth";
const SS_KEY="cline-mgmt-key";

/* ---------- management key acquisition ----------
   1) ?key= URL param, removed from history and kept in sessionStorage.
   2) sessionStorage from manual input.
   3) CPA main panel localStorage "cli-proxy-auth" when embedded same-origin. */
function _enc(t){return new TextEncoder().encode(t)}
function _dec(b){return new TextDecoder().decode(b)}
function _keyBytes(){try{return _enc(SECRET_SALT+"|"+window.location.host+"|"+navigator.userAgent)}catch(e){return _enc(SECRET_SALT)}}
function _xor(d,k){const r=new Uint8Array(d.length);for(let i=0;i<d.length;i++)r[i]=d[i]^k[i%k.length];return r}
function _b64d(s){const bin=atob(s);const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return b}
function deobfuscate(p){if(!p||!p.startsWith(ENC_PREFIX))return p;try{return _dec(_xor(_b64d(p.slice(ENC_PREFIX.length)),_keyBytes()))}catch(e){return p}}
function isEmbedded(){try{return window.self!==window.top}catch(e){return false}}
let sessionKeySuppressed=false;
function readSessionKey(){if(sessionKeySuppressed)return null;try{return sessionStorage.getItem(SS_KEY)}catch(_){return null}}
function storeSessionKey(k){try{sessionStorage.setItem(SS_KEY,k);sessionKeySuppressed=false;return true}catch(_){return false}}
function clearSessionKey(){sessionKeySuppressed=true;try{sessionStorage.removeItem(SS_KEY)}catch(_){}}
function readPanelKey(){
  if(!isEmbedded())return null;
  let raw;try{raw=localStorage.getItem(PANEL_STORE)}catch(e){return null}
  if(!raw)return null;
  try{
    const parsed=JSON.parse(deobfuscate(raw));
    const st=(parsed&&parsed.state)||parsed||{};
    return typeof st.managementKey==="string"&&st.managementKey?st.managementKey:null;
  }catch(e){return null}
}
function captureUrlKey(){
  const url=new URL(window.location.href);
  const key=url.searchParams.get("key");
  if(!key)return;
  try{if(!storeSessionKey(key))clearSessionKey()}finally{
    url.searchParams.delete("key");
    history.replaceState(null,"",url.pathname+url.search+url.hash);
  }
}
captureUrlKey();
function getKey(){return sessionKeySuppressed?null:(readSessionKey()||readPanelKey())}
function saveKey(){
  const v=document.getElementById("keyInput").value.trim();
  if(!v)return;
  if(!storeSessionKey(v)){showAuth();return}
  document.getElementById("authBox").style.display="none";
  load(true);
}
function showAuth(){document.getElementById("authBox").style.display="block";const i=document.getElementById("keyInput");i&&i.focus()}
function authHeaders(k){return k?{"Authorization":"Bearer "+k}:{}}
/* --------------------------------------------------------------------------- */

function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function asText(v){if(v==null)return "";if(typeof v==="string")return v;if(typeof v==="object"){try{return JSON.stringify(v)}catch(e){return String(v)}}return String(v)}
function toast(title,kind="ok",detail=""){
  const box=document.getElementById("toasts");
  const el=document.createElement("div");
  el.className="toast "+kind;
  el.innerHTML='<div class="t"></div>'+(detail?'<div class="d"></div>':'');
  el.querySelector(".t").textContent=title;
  if(detail)el.querySelector(".d").textContent=detail;
  box.appendChild(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add("show")));
  const kill=()=>{el.classList.remove("show");setTimeout(()=>el.remove(),300)};
  el.onclick=kill;
  setTimeout(kill,kind==="err"?6000:4000);
  while(box.children.length>5)box.firstChild.remove();
}
function busy(btn,on){
  if(!btn)return;
  if(on){btn.dataset.orig=btn.innerHTML;btn.disabled=true;btn.innerHTML='<span class="spin"></span>处理中…'}
  else{btn.disabled=false;if(btn.dataset.orig)btn.innerHTML=btn.dataset.orig}
}
let authFailCount=0;
let authFailUntil=0;
function panelContentType(response){const raw=response.headers&&response.headers.get?response.headers.get("content-type")||"":"",v=(raw.split(";",1)[0].trim().toLowerCase()||"unknown");return v}
function panelHTTPError(kind,response){return new Error(kind+"（HTTP "+response.status+"，"+panelContentType(response)+"）")}
async function readPanelResponse(response){
  let text="";try{text=await response.text()}catch(_){throw panelHTTPError("响应读取失败",response)}
  if(!text)throw panelHTTPError("响应为空",response);
  const ct=panelContentType(response);
  if(ct!=="application/json"&&!ct.endsWith("+json"))throw panelHTTPError("响应格式无效",response);
  let data;try{data=JSON.parse(text)}catch(_){throw panelHTTPError("响应 JSON 无效",response)}
  if(!response.ok)throw panelHTTPError("请求失败",response);
  return data;
}
function rejectPanelAuth(response){
  if(response.status!==401&&response.status!==403)return;
  authFailCount++;clearSessionKey();showAuth();
  if(authFailCount>=3){authFailUntil=Date.now()+60000;authFailCount=0;throw new Error("认证多次失败，请检查管理密钥后 60s 再试")}
  throw new Error(response.status===401?"management key 无效或缺失":"禁止访问 (403)");
}
async function rawAPI(base,path,opts={}){
  const k=getKey();
  if(!k){showAuth();throw new Error("需要管理密钥")}
  if(Date.now()<authFailUntil)throw new Error("认证多次失败，请稍后重试");
  let r;
  try{r=await fetch(base+path,{...opts,credentials:"omit",headers:{...(opts.headers||{}),...authHeaders(k)}})}
  catch(_){throw new Error("网络请求失败")}
  rejectPanelAuth(r);
  authFailCount=0;
  return readPanelResponse(r);
}
function api(path,opts={}){return rawAPI(API,path,opts)}
function managementAPI(path,opts={}){return rawAPI(MANAGEMENT_BASE_PATH,path,opts)}

/* ---- accounts ---- */
let currentGroup="all";
let accountSearch="";
let lastAccounts=[];
let lastModels=[];
let modelGroups={};
let currentOverlay={};

function accountNick(a){return String((a&&(a.nickname||a.label||a.email))||"该账号")}
function accountPlan(a){
  if(a&&a.plan_status==="active")return {text:a.plan||"ClinePass",cls:"ok"};
  return {text:a&&a.plan_status?a.plan_status:"未订阅",cls:"unknown"};
}
function accountCard(a){
  const plan=accountPlan(a);
  const nickname=accountNick(a);
  const meta=[a.email,a.file].filter(Boolean).join(" · ");
  return `<div class="card" data-auth="${esc(a.id||"")}">
  <h2>${esc(nickname)} <span style="display:flex;gap:6px;align-items:center"><span class="badge ${plan.cls}">${esc(plan.text)}</span></span></h2>
  <div class="uid">${esc(meta)}</div>
  <div class="row"><span class="k">最后检查</span><span class="v mut">${esc(a.last_checked||"")}</span></div>
  <div class="actions">
    <button class="sec" data-action="rename" data-auth="${esc(a.id||"")}" data-nick="${esc(a.nickname||"")}">重命名</button>
    <button class="sec" data-action="delete" data-auth="${esc(a.id||"")}" data-nick="${esc(nickname)}" style="background:var(--err-soft);color:var(--err)">删除</button>
  </div>
  </div>`;
}
function renderAccounts(){
  const g=document.getElementById("grid");
  const q=accountSearch.trim().toLowerCase();
  const list=(lastAccounts||[]).filter(a=>!q||[a.nickname,a.label,a.email,a.file].some(v=>String(v||"").toLowerCase().includes(q)));
  if(!lastAccounts.length){g.innerHTML='<div class="loading">暂无 Cline OAuth 账号，点击上方“OAuth 登录”。</div>';return}
  if(!list.length){g.innerHTML='<div class="loading">没有匹配的账号</div>';return}
  g.innerHTML=list.map(accountCard).join("");
  g.querySelectorAll("[data-action]").forEach(btn=>btn.addEventListener("click",()=>{
    if(btn.dataset.action==="rename")renameAccount(btn.dataset.auth,btn.dataset.nick||"");
    else if(btn.dataset.action==="delete")deleteAccount(btn.dataset.auth,btn.dataset.nick||"该账号");
  }));
}
function setAccountSearch(v){accountSearch=v||"";renderAccounts()}
function renderSummary(){
  const box=document.getElementById("summaryBox");
  if(!lastAccounts.length){box.style.display="none";box.innerHTML="";return}
  const active=lastAccounts.filter(a=>a.plan_status==="active").length;
  box.style.display="block";
  box.innerHTML=`<div class="summary-hd"><div class="summary-title">账号汇总</div><div class="summary-meta">${lastAccounts.length} 个账号 · 订阅生效 ${active}</div></div>
  <div class="summary-grid">
    <div class="summary-item"><div class="k">账号</div><div class="v">${lastAccounts.length}</div></div>
    <div class="summary-item"><div class="k">ClinePass 生效</div><div class="v ok">${active}</div></div>
    <div class="summary-item"><div class="k">未订阅</div><div class="v">${lastAccounts.length-active}</div></div>
  </div>`;
}
async function renameAccount(id,current){
  const name=(prompt("账号显示名：",current||"")||"").trim();
  if(name===current)return;
  try{
    const r=await api("/accounts/rename",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id,name})});
    if(r&&r.status!=="ok"){toast("重命名失败","err",asText(r&&r.error)||"unknown");return}
    toast("已重命名","ok",name);
    await load(true);
  }catch(e){toast("重命名失败","err",e.message||String(e))}
}
async function deleteAccount(id,name){
  if(!confirm(`删除账号「${name}」？凭证会被移除，之后可在面板重新登录。`))return;
  try{
    const r=await api("/accounts/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id})});
    if(r&&r.error){toast("删除失败","err",asText(r.error));return}
    const res=await fetch(r.url,{method:r.method||"DELETE",credentials:"omit",headers:authHeaders(getKey())});
    if(!res.ok){toast("删除失败","err","CPA 返回 HTTP "+res.status);return}
    toast("已删除","ok","可重新登录");
    await load(true);
  }catch(e){toast("删除失败","err",e.message||String(e))}
}

/* ---- models ---- */
const MODEL_SOURCE_LABEL={dynamic:"上游实时","cline-recommended":"上游实时",config:"配置覆盖",cache:"缓存",fallback:"内置回退",none:"未知"};
function normalizeModel(m){
  const id=String((m&&(m.id??m.ID))||"");
  const displayName=String((m&&(m.displayName??m.DisplayName??m.name??m.Name))||"");
  const name=String((m&&(m.name??m.Name??m.displayName??m.DisplayName))||"");
  return {id,displayName,name,hidden:!!(m&&m.hidden),raw:m};
}
function normalizeModels(list){
  return Array.isArray(list)?list.map(normalizeModel).filter(m=>m.id):[];
}
function modelGroup(id){
  for(const [group,ids] of Object.entries(modelGroups||{})){
    if(Array.isArray(ids)&&ids.includes(id))return group;
  }
  if(id.startsWith("cline-pass/"))return "clinepass";
  if(id.startsWith("cline-free/")||id.endsWith(":free"))return "free";
  if(id.startsWith("cline-cloud/"))return "clinecloud";
  return "default";
}
function hiddenSet(){const inner=(currentOverlay&&currentOverlay.overlay)||currentOverlay||{};return new Set(Array.isArray(inner.hide)?inner.hide:[])}
function filterGroup(group,btn){
  currentGroup=group||"all";
  document.querySelectorAll("#filterBar .ftag").forEach(b=>b.classList.remove("active"));
  if(btn)btn.classList.add("active");
  else document.querySelectorAll('#filterBar .ftag[data-group="'+currentGroup+'"]').forEach(b=>b.classList.add("active"));
  renderModels();
}
function updateGroupCounts(){
  const counts={all:lastModels.length,default:0,clinepass:0,free:0,clinecloud:0};
  lastModels.forEach(m=>{const g=modelGroup(m.id);if(counts[g]!=null)counts[g]++});
  const map={all:"cntAll",default:"cntDefault",clinepass:"cntPass",free:"cntFree",clinecloud:"cntCloud"};
  for(const [k,id] of Object.entries(map)){const el=document.getElementById(id);if(el)el.textContent=String(counts[k]||0)}
}
// fetchModels reads the catalog CPA actually serves.
//
// refresh=1 asks the plugin to pull each account from Cline again; without it the
// plugin answers from its cache, so opening the panel never fans out one upstream
// call per account. A failed pull falls back to the cached catalog instead of
// blanking the section.
async function fetchModels(refresh){
  try{return await api("/models"+(refresh?"?refresh=1":""))}
  catch(e){if(!refresh)throw e;return await api("/models")}
}
async function loadModels(showError,preserveOnEmpty){
  const box=document.getElementById("modelList");
  const srcEl=document.getElementById("modelSource");
  const hintEl=document.getElementById("modelHint");
  try{
    const d=await fetchModels(showError);
    const next=normalizeModels(d.models);
    // A config PATCH makes CPA drop and re-register the catalog, so a read that
    // lands mid-reload comes back empty. Keeping the previous rows beats showing
    // an empty list that the operator reads as "hiding deleted everything".
    if(preserveOnEmpty&&next.length===0&&lastModels.length>0){
      hintEl.textContent=`配置已保存，模型目录正在重载 · 暂时保留 ${lastModels.length} 个模型`;
      renderModels();
      return false;
    }
    lastModels=next;
    modelGroups=(d.groups&&typeof d.groups==="object")?d.groups:{};
    currentOverlay=d.overlay||{};
    const src=d.source||"none";
    srcEl.textContent=MODEL_SOURCE_LABEL[src]||src;
    hintEl.textContent=`共 ${lastModels.length} 个模型 · 隐藏写入插件配置，排序和自定义仅内存`;
    updateGroupCounts();
    renderModels();
    return true;
  }catch(e){
    box.innerHTML=`<div class="mut">加载失败：${esc(e.message||String(e))}</div>`;
    srcEl.textContent="—";
    if(showError)toast("模型加载失败","err",e.message||String(e));
    return false;
  }
}
function hideListOf(d){
  const inner=(d&&d.overlay&&d.overlay.overlay)||d.overlay||{};
  return Array.isArray(inner.hide)?inner.hide:[];
}
async function waitForReloadedModels(){
  for(let attempt=0;attempt<5;attempt++){
    if(await loadModels(false,true))return true;
    await new Promise(resolve=>setTimeout(resolve,150*(attempt+1)));
  }
  return false;
}
function renderModels(){
  const box=document.getElementById("modelList");
  if(!box)return;
  const hidden=hiddenSet();
  const models=lastModels.filter(m=>currentGroup==="all"||modelGroup(m.id)===currentGroup);
  if(!models.length){box.innerHTML='<div class="mut">暂无模型</div>';return}
  box.innerHTML=`<div class="model-rows">`+models.map((m,i)=>{
    const id=m.id;
    const name=m.displayName||m.name||"";
    const isHidden=hidden.has(id)||!!m.hidden;
    const prev=models[i-1]?models[i-1].id:"";
    const afterNext=models[i+2]?models[i+2].id:"";
    return `<div class="model-row ${isHidden?"hidden":""}">
      <span class="model-id" title="${esc(id)}">${esc(id)}</span>
      <span class="model-name mut">${esc(name)}</span>
      <span class="model-actions">
        ${isHidden?"":`
          <button type="button" class="ftag" onclick="moveModel('${esc(id)}','${esc(prev)}')" aria-label="上移 ${esc(id)}"${i===0?" disabled":""}>↑</button>
          <button type="button" class="ftag" onclick="moveModel('${esc(id)}','${esc(afterNext)}')" aria-label="下移 ${esc(id)}"${i===models.length-1?" disabled":""}>↓</button>
        `}
        ${isHidden?`<button type="button" class="ftag" onclick="modelAction('restore','${esc(id)}')">恢复</button>`:`<button type="button" class="ftag" onclick="modelAction('hide','${esc(id)}')">隐藏</button>`}
      </span>
      ${isHidden?'<span class="badge disabled">已隐藏</span>':""}
    </div>`;
  }).join("")+`</div>`;
}
async function modelAction(action,id,before){
  try{
    const payload={action,id};
    if(action==="move")payload.before=before||"";
    const d=await api("/models/action",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    if(d&&d.models)lastModels=normalizeModels(d.models);
    if(d&&d.groups)modelGroups=d.groups;
    if(d&&d.overlay)currentOverlay=d.overlay;
    if(action==="hide"||action==="restore"){
      // The plugin overlay is process-local. CPA re-registers models from the
      // persisted plugin config, so a hide that is not written back there shows
      // up in this panel and nowhere else, and is gone after a restart.
      await managementAPI("/plugins/cline/config",{method:"PATCH",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({hidden_models:hideListOf(d)})});
      await waitForReloadedModels();
    }else{
      toast("排序和自定义模型仅保存在内存中，CPA 重启后恢复","warn");
      await loadModels(false);
    }
    updateGroupCounts();
    renderModels();
  }catch(e){toast("模型操作失败","err",e.message||String(e))}
}
function moveModel(id,before){modelAction("move",id,before||"")}
async function addModel(){
  const input=document.getElementById("modelAddInput");
  const id=String(input.value||"").trim();
  if(!id){toast("请输入模型 ID","warn");return}
  input.value="";
  await modelAction("add",id);
}

/* ---- load ---- */
async function load(force,btn){
  const g=document.getElementById("grid");
  if(!getKey()){showAuth();g.innerHTML='<div class="loading">请先填写 management key</div>';return false}
  if(force){if(!btn)btn=document.getElementById("refreshBtn");busy(btn,true)}
  try{
    const [acct,models]=await Promise.all([api("/accounts"),fetchModels(force)]);
    lastAccounts=Array.isArray(acct.accounts)?acct.accounts:[];
    lastModels=normalizeModels(models.models);
    modelGroups=(models.groups&&typeof models.groups==="object")?models.groups:{};
    currentOverlay=models.overlay||{};
    document.getElementById("modelSource").textContent=MODEL_SOURCE_LABEL[models.source||"none"]||(models.source||"—");
    document.getElementById("modelHint").textContent=`共 ${lastModels.length} 个模型 · 插件内隐藏/排序/添加配置`;
    renderAccounts();
    renderSummary();
    updateGroupCounts();
    renderModels();
    if(force)toast("数据已刷新","ok",lastAccounts.length+" 个账号 · "+lastModels.length+" 个模型");
    return true;
  }catch(e){
    if(force)toast("刷新失败","err",e.message||String(e));
    if(!force||!g.querySelector(".card"))g.innerHTML='<div class="loading">'+esc(e.message||String(e))+"</div>";
    return false;
  }finally{
    if(force)busy(btn,false);
  }
}

/* ---- OAuth ---- */
let oauthState="";
let oauthURL="";
let oauthDeadline=0;
let oauthPollTimer=null;
let oauthPollGeneration=0;
function oauthStatusText(text,kind){
  const el=document.getElementById("oauthStatus");
  el.textContent=text;
  el.className="oauth-status"+(kind?" "+kind:"");
}
function stopOAuthPolling(){oauthPollGeneration++;if(oauthPollTimer){clearTimeout(oauthPollTimer);oauthPollTimer=null}}
function openOAuthModal(){
  document.getElementById("oauthModal").classList.add("show");
  startOAuthLogin(document.querySelector("#oauthModal .modal-ft button:last-child"));
}
function closeOAuthModal(){stopOAuthPolling();document.getElementById("oauthModal").classList.remove("show")}
function onOAuthMaskClick(e){if(e.target===document.getElementById("oauthModal"))closeOAuthModal()}
function openOAuthURL(){if(!oauthURL)return;try{window.open(oauthURL,"_blank","noopener,noreferrer")}catch(_){}}
async function copyOAuthURL(btn){
  if(!oauthURL)return;
  busy(btn,true);
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText)await navigator.clipboard.writeText(oauthURL);
    else{const input=document.getElementById("oauthUrl");input.focus();input.select();document.execCommand("copy")}
    toast("登录链接已复制","ok");
  }catch(_){toast("请手动复制登录链接","warn")}
  finally{busy(btn,false)}
}
function scheduleOAuthPoll(generation){oauthPollTimer=setTimeout(()=>pollOAuthLogin(generation),1500)}
async function pollOAuthLogin(generation){
  if(generation!==oauthPollGeneration)return;
  if(Date.now()>=oauthDeadline){oauthStatusText("登录会话已过期，请重新获取登录链接。","err");stopOAuthPolling();return}
  try{
    const d=await api("/oauth/poll",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({state:oauthState})});
    if(generation!==oauthPollGeneration)return;
    if(d.status==="pending"){
      const left=Math.max(0,Math.ceil((oauthDeadline-Date.now())/1000));
      oauthStatusText("等待浏览器完成登录…（剩余 "+left+" 秒）");
      scheduleOAuthPoll(generation);
      return;
    }
    if(d.status==="ok"){
      oauthStatusText("登录成功。账号已写入 CPA。","ok");
      stopOAuthPolling();
      toast("OAuth 登录成功","ok",d.label||d.file||"Cline 账号已添加");
      await load(true);
      return;
    }
    oauthStatusText(d.error||"登录失败，请重新获取登录链接。","err");
    stopOAuthPolling();
  }catch(e){
    if(generation!==oauthPollGeneration)return;
    oauthStatusText("登录状态查询失败："+String(e.message||e),"err");
    scheduleOAuthPoll(generation);
  }
}
async function startOAuthLogin(btn){
  stopOAuthPolling();
  oauthState="";oauthURL="";oauthDeadline=0;
  document.getElementById("oauthUrl").value="";
  oauthStatusText("正在创建登录会话…");
  busy(btn,true);
  try{
    const d=await api("/oauth/start",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});
    if(d.status!=="pending"||!d.url||!d.state)throw new Error(d.error||"登录会话创建失败");
    oauthState=d.state;oauthURL=d.url;
    oauthDeadline=Date.now()+300000;
    document.getElementById("oauthUrl").value=d.url;
    oauthStatusText("请在浏览器完成登录，本页会自动检测。");
    openOAuthURL();
    scheduleOAuthPoll(oauthPollGeneration);
  }catch(e){oauthStatusText(String(e.message||e),"err")}
  finally{busy(btn,false)}
}
function restartOAuthLogin(btn){return startOAuthLogin(btn)}

document.getElementById("keyInput").addEventListener("keydown",e=>{if(e.key==="Enter")saveKey()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&document.getElementById("oauthModal").classList.contains("show"))closeOAuthModal()});
document.getElementById("apiPath").textContent=API;
if(window.__clineThemeSync)window.__clineThemeSync();
if(getKey())load(true);else showAuth();
</script>
